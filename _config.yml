# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Yohoten's Blog
subtitle: 记录技术 · 分享生活 · 保持热爱
description: yohoten's blog 个人技术博客，分享技术教程、学习心得与生活感悟。
keywords: 博客,数据分析,机器学习,Python,XGBoost,Streamlit,数据可视化,桌面自动化
author: yohoten
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://yohoten.github.io
## 【自定义域名待启用 · 现状：chenxiaoxue.space 当前 DNS 无解析记录（本机 nslookup / curl 均取不到 IP）】
## 绑定自定义域名需三步同时完成，缺一则 sitemap / atom.xml / canonical 的绝对 URL 会指向不可达地址：
##   1. 域名 DNS 添加 CNAME 记录指向 yohoten.github.io（A 记录亦可，见 GitHub 文档）
##   2. 新建 source/CNAME，内容单行写入 chenxiaoxue.space
##   3. 把上面 url 改为 https://chenxiaoxue.space，并同步 Settings → Pages → Custom domain
## 三步确认全部就绪后，取消下面两行的注释即为最终形态：
# url: https://chenxiaoxue.space
# root: /
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
## include 用于把默认被忽略的点文件纳入生成（.nojekyll 让 GitHub Pages 跳过 Jekyll 处理）
include:
  - .nojekyll
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Search
## 本地搜索数据（需配合 hexo-generator-search 插件）
search:
  path: search.xml
  field: post
  content: true

# Sitemap（需 hexo-generator-sitemap 插件）
sitemap:
  path: sitemap.xml

# Feed / RSS 订阅（需 hexo-generator-feed 插件）
# 生成 /atom.xml；autodiscovery 会自动往每个页面的 <head> 注入
# <link rel="alternate" type="application/atom+xml">，供 RSS 阅读器与 AI 聚合器自动发现
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content: true
  icon: /images/favicon.svg
  autodiscovery: true

# Deployment
## 本站统一由 GitHub Actions 部署，本地 deploy 已停用（见下方说明），无需 hexo-deployer-git。
## CI 链路：.github/workflows/deploy.yml → npm ci → hexo generate → 推送 public/ 到 gh-pages 分支
##
## 【务必核对】Settings → Pages → Build and deployment → Source 必须是
##   "Deploy from a branch" 且分支选 gh-pages / 目录选 / (root)，
##   否则 CI 跑成功但线上不更新。
##
## 本地一键部署已弃用（目标分支 main 与 CI 的 gh-pages 不一致，双链路容易互相覆盖；
## 且本机 github.com:443 不可达，HTTPS 方式推送必然失败）。确需恢复时再取消下方注释：
# deploy:
#   type: git
#   repo: git@github.com:yohoten/yohoten.github.io.git   # 必须走 SSH，HTTPS 在本机不可达
#   branch: gh-pages                                     # 与 CI 保持一致
