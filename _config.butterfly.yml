# ============================================================
# Yohoten's Blog - Butterfly 主题配置
# 说明：此文件为站点级主题配置，优先级高于主题包内置的 _config.yml
# 只写需要覆盖/启用的配置项即可，未写到的项使用主题默认值
# 文档：https://butterfly.js.org/posts/4aa8abbe/
# ============================================================

# ---------- 导航栏 ----------
nav:
  logo: /images/logo.svg
  display_title: false # logo 已含标题文字，不再重复显示
  fixed: true

# ---------- 菜单 ----------
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  作品集: /showcase/ || fas fa-chart-line
  小口袋: /tools/ || fas fa-toolbox
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

# ---------- 代码块（mac 风格） ----------
highlight_theme: mac
highlight_copy: true
highlight_lang: true
highlight_shrink: false

# ---------- 数学公式（MathJax，per_page 时仅在 front-matter 标记 mathjax: true 的文章页加载） ----------
mathjax:
  enable: true
  per_page: true

# ---------- 社交链接（请替换为你的真实地址） ----------
social:
  fab fa-github: https://github.com/yohoten || Github || "#24292e"
  fab fa-git-alt: https://gitee.com/yohoten || Gitee || "#C71D23"
  fab fa-zhihu: https://www.zhihu.com/people/yohoten || Zhihu || "#0084ff"
  fas fa-globe: https://chenxiaoxue.space || Website || "#3b82f6"
  fas fa-envelope: mailto:yoho12138@qq.com || Email || "#4a7dbe"

# ---------- 站点图标与头像 ----------
favicon: /images/favicon.svg
avatar:
  img: /images/wechat_avatar_01.jpg
  effect: true # 头像旋转效果

# ---------- 顶部横幅图片 ----------
disable_top_img: false
index_img: /images/banner-20240815_DSC.webp        # 首页横幅
default_top_img: /images/banner-20240815_DSC.webp  # 默认文章/页面横幅
archive_img: /images/banner-20240815_DSC.webp      # 归档页横幅

# ---------- 文章封面 ----------
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:
    - /images/cover1.svg
    - /images/cover2.svg
    - /images/cover3.svg
    - /images/cover4.svg

# ---------- 首页文章摘要 ----------
index_post_content:
  method: 2 # 2: 优先显示 description，否则自动截取正文
  length: 300

# ---------- 文章元信息 ----------
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# ---------- 目录 ----------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# ---------- 文章版权 ----------
post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# ---------- 相关文章 ----------
related_post:
  enable: true
  limit: 6
  date_type: created

# ---------- 页脚 ----------
# custom_text 支持 HTML：末尾追加了 RSS 订阅入口（/atom.xml）
footer:
  owner:
    enable: true
    since: 2025
  custom_text: '记录技术 · 分享生活 · 保持热爱 · <a class="footer-rss" href="/atom.xml" target="_blank" rel="noopener" title="订阅本站 RSS"><i class="fas fa-rss"></i> RSS 订阅</a>'
  copyright: true

# ---------- 侧边栏 ----------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 过了垭口，就是平原
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/yohoten
  card_announcement:
    enable: true
    content: 欢迎来到 Yohoten's Blog，一起记录成长～
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ---------- 访问统计（不蒜子，公共免费服务） ----------
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# ---------- 阅读模式 / 暗色模式 ----------
readmode: true
darkmode:
  enable: true
  button: true
  autoChangeMode: 2 # 2: 18:00-6:00 自动切换深色

# ---------- 主题色（参考站 hue=250 的紫色调） ----------
theme_color:
  enable: true
  main: "#8b5cf6"
  paginator: "#7c3aed"
  button_hover: "#a855f7"
  text_selection: "#a855f7"
  link_color: "#7c3aed"
  meta_color: "#858585"
  hr_color: "#c4b5fd"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#8b5cf6"
  blockquote_padding_color: "#8b5cf6"
  blockquote_background_color: "#8b5cf6"
  scrollbar_color: "#8b5cf6"
  meta_theme_color_light: "#ffffff"
  meta_theme_color_dark: "#0d0d0d"

# ---------- 首页布局 ----------
index_site_info_top: 28%
index_top_img_height: 58vh

# ---------- 页脚背景与遮罩 ----------
footer_bg: true
mask:
  header: true
  footer: true

# ---------- 页面效果 ----------
enter_transitions: true
rightside_scroll_percent: true

# ---------- 本地搜索（需已安装 hexo-generator-search） ----------
# preload: false —— search.xml 不在首页预加载，改为首次点开搜索框时再请求（首屏少一个请求）
local_search:
  enable: true
  preload: false
  top_n_per_article: 1
  unescape: false

# ---------- 404 页面（需 source/404.md，配合 type: "404"） ----------
error_404:
  enable: true
  subtitle: '🌌 糟糕，页面走丢了…不过没关系，让我送你回首页～'
  background: /images/cover4.svg

# ---------- 图片懒加载 ----------
lazyload:
  enable: true
  field: site # site/post
  placeholder:
  blur: false

# ---------- 评论系统：Giscus（基于 GitHub Discussions，零后端） ----------
#
# ⚠️ 当前状态：差最后一步，未启用。
#    核查结果（GitHub API）：仓库 yohoten/yohoten.github.io 的 has_discussions = false，
#    即 Discussions 尚未开启，此时挂上评论会出现加载失败。
#
# 启用步骤（约 3 分钟，均需在你的 GitHub 账号下操作）：
#   1. 仓库 Settings → General → Features 勾选 Discussions，保存后在 Discussions 里建一个分类
#      （推荐 Announcements，或新建「Blog Comments」）
#   2. 安装 giscus app：https://github.com/apps/giscus → Configure → 只对 yohoten.github.io 授权
#   3. 取得该分类的 id（repo_id 已帮你查到并填好）：
#      打开 https://docs.github.com/en/graphql/overview/explorer 执行
#        query { repository(owner:"yohoten", name:"yohoten.github.io") {
#                  discussionCategories(first:10){ nodes{ id name } } } }
#      把对应分类的 id 填到下面 category_id
#   4. 取消下方 comments: 与 giscus: 两处注释，执行 npx hexo clean && npx hexo generate
#
# 选 Giscus 而非 Twikoo 的理由：本站纯静态托管在 GitHub Pages，Giscus 把评论存在
# GitHub Discussions，无需自建服务端、无数据库运维成本，也没有第三方服务停摆风险。

giscus:
  repo: yohoten/yohoten.github.io
  repo_id: R_kgDOT1gaRw        # 已实测获取（REST /repos 返回的 node_id）
  category_id: TODO_FILL_ME    # ← 步骤 3 拿到后替换
  theme:
    light: light               # 浅色主题
    dark: dark                 # 深色主题（站点已启用 darkmode，会随主题自动切换）
  option:

# comments:
#   use: giscus
#   text: true                 # 评价/ Emoji 反馈按钮
#   lazyload: true             # 滚动到评论区才加载 iframe，不影响正文性能
#   count: false               # 不在列表页显示评论数（省一次 API 往返）
#   card_post_count: false

# ---------- PWA ----------
# Butterfly 只注入 manifest 与各端图标 link；离线缓存需另行加 Service Worker（当前未加）。
# 也就是说：用户可"添加到主屏幕"并获得独立窗口与正确图标，但 Chrome 的
# 完整"可安装 PWA"判定还要求 Service Worker，如需离线访问再补。
pwa:
  enable: true
  manifest: /pwa/manifest.json
  theme_color: "#8b5cf6" # 与站点主题色一致
  apple_touch_icon: /pwa/icons/apple-touch-icon.png # iOS 添加到主屏幕（SVG 不被 iOS 支持，故用 PNG）
  favicon_32_32: /pwa/icons/favicon-32x32.png
  favicon_16_16: /pwa/icons/favicon-16x16.png
  mask_icon: /images/favicon.svg # Safari 固定标签页（需单色 SVG）

# ---------- 注入自定义资源 ----------
# 作品集页面样式与分页脚本；404 页面美化样式与增强脚本；移动端侧栏精简样式
inject:
  head:
    - <link rel="stylesheet" href="/css/showcase.css">
    - <link rel="stylesheet" href="/css/404.css">
    - <link rel="stylesheet" href="/css/mobile-aside.css">
    - <link rel="stylesheet" href="/css/footer-rss.css">
  bottom:
    - <script src="/js/showcase-pagination.js" defer></script>
    - <script src="/js/showcase-reveal.js" defer></script>
    - <script src="/js/404.js" defer></script>
